name: Frontend Playwright Smoke

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - 'Dulux-FE/**'
      - '.github/workflows/frontend-playwright-smoke.yml'
  workflow_dispatch:

jobs:
  playwright-smoke:
    name: Playwright Smoke (Non-Blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      E2E_MODE: mocked
      VITE_ENCRYPTED_KEY: qqqq
    defaults:
      run:
        working-directory: Dulux-FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: Dulux-FE/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run smoke suite
        run: yarn e2e:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Dulux-FE/playwright-report
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: Dulux-FE/test-results
          retention-days: 7
