server {
    listen 80;
    server_name ${SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${SERVER_NAME};

    sendfile     on;
    default_type application/octet-stream;
    client_max_body_size 50M;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      expired no-cache no-store private auth;
    gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript font/eot font/otf font/ttf;
    gzip_disable      "MSIE [1-6]\.";
    gzip_http_version 1.1;
    gzip_comp_level   6;

    # TODO(audit SEC-04 High): Flower (Celery monitoring dashboard) is exposed without
    # authentication at /flower. Anyone with the URL can view task queues, arguments
    # (which contain registration IDs, phone numbers), and worker status. Add HTTP
    # basic auth via Nginx (auth_basic) or restrict to VPN/internal network.
    location /flower {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_pass http://flower:5555;
    }

    location / {
        try_files $uri @fallback;
    }

    # TODO(audit ARCH-02 Medium): No WebSocket upgrade support in Nginx config.
    # The @fallback location proxies to Gunicorn (WSGI) without proxy_http_version 1.1,
    # Upgrade, or Connection headers. WebSocket connections at ws/complaints/ will fail.
    # Add a dedicated location block for /ws/ with WebSocket proxy headers pointing to
    # a Daphne/Uvicorn ASGI process.
    location @fallback {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_pass http://django:8000;
    }

    # TODO(audit OPS-07 Medium): Missing security headers in Nginx config. Add:
    # add_header X-Content-Type-Options "nosniff" always;
    # add_header X-Frame-Options "DENY" always;
    # add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    ssl_certificate /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
